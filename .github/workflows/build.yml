name: Build macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app and run checks
        run: ARCHS='arm64 x86_64' ./scripts/build.sh
      - name: Verify app
        run: |
          codesign --verify --deep --strict 'dist/Android Connect.app'
          lipo 'dist/Android Connect.app/Contents/MacOS/AndroidConnect' -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Connect-macOS
          path: dist/Android Connect.app
